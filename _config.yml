
plugins:
- jekyll-paginate

paginate: 4 # jekyll-paginate > items per page
paginate_path: "/news/page:num/" # jekyll-paginate > blog page

sass:
  style: compressed # Style compression
permalink: pretty  # Permalink style (/YYYY/MM/DD/page-name/)
excerpt_separator: <!-- more --> # Marks end of excerpt in posts
timezone: America/New_York # Timezone for blog posts and alike

collections:
  posts:
    title: Polar History News Section # Needed for Siteleaf
    output: true
    description: ""

defaults:
  -
    scope:
      path: ""
      type: pages
    values:
      layout: page # Default layout
  -
    scope:
      path: ""
      type: posts
    values:
      layout: post # Default layout

encoding: utf-8 # Make sure the encoding is right
title: "Polar History" # Site name or title
#logo: "/assets/logo.svg" # Site logo
# favicon: "/favicon.ico" # Uncomment to add custom favicon, or leave as is to use site logo
description: "Stuff"
url: "http://babryce.com/cooktest" # Site url
baseurl: "http://babryce.com/cooktest"
navurl: "http://babryce.com/cooktest/nav"
lang: en-GB
